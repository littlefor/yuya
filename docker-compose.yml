name: linguaseed

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/linguaseed
      JWT_SECRET: ${JWT_SECRET:-linguaseed-dev-secret-change-me}
      SEED_ON_START: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  miniprogram:
    build:
      context: ./miniprogram
    restart: unless-stopped
    environment:
      API_BASE_URL: ${MINIPROGRAM_API_BASE:-http://127.0.0.1:8080}
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
